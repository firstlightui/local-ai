name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist

      - if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - run: vendor/bin/pest

  # Unit tests for the Android request parser, and a typecheck of every Kotlin source against
  # android.jar and the ML Kit classes. iOS typechecking needs Xcode: run bin/typecheck-ios locally.
  android:
    name: Android Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Kotlin tests and Android typecheck
        working-directory: resources/android
        run: ./gradlew test compileHostCheckKotlin --console=plain
